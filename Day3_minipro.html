<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Buna Corner — Business Profile</title>

  <!-- Google Font -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@700&display=swap"
    rel="stylesheet"
  >

  <style>
    /* Design System */
    :root {
      --color-bg: #f5efe5;
      --color-card: #fffdf8;
      --color-primary: #6b3f24;
      --color-primary-hover: hsl(25, 49%, 27%);
      --color-accent: #d69b45;
      --color-text: #29231f;
      --color-muted: #746b64;
      --color-border: #e3d6c5;

      --space-1: 0.25rem;
      --space-2: 0.5rem;
      --space-3: 0.75rem;
      --space-4: 1rem;
      --space-5: 1.5rem;
      --space-6: 2rem;
      --space-7: 3rem;

      --radius-card: 18px;
      --radius-button: 999px;
      --shadow-card: 0 18px 45px rgba(75, 48, 29, 0.12);
    }

    /*  Global  */
    *,
    *::before,
    *::after {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: var(--space-6);

      background: var(--color-bg);
      color: var(--color-text);
      font-family: "Inter", sans-serif;
      line-height: 1.7;
    }

    /*  Card  */
    .profile-card {
      position: relative;
      width: min(100%, 560px);

      margin: var(--space-6);
      padding: var(--space-7);

      background: var(--color-card);
      border: 1px solid var(--color-border);
      border-radius: var(--radius-card);
      box-shadow: var(--shadow-card);

      overflow: hidden;
    }

    /* Decorative pseudo-element */
    .profile-card::before {
      content: "";
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 7px;
      background: var(--color-accent);
    }

    .category {
      margin: 0 0 var(--space-2);
      color: var(--color-accent);
      font-size: 0.8rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
    }

    h1 {
      margin: 0 0 var(--space-2);
      color: var(--color-primary);
      font-family: "Playfair Display", serif;
      font-size: clamp(2rem, 6vw, 3rem);
      line-height: 1.15;
    }

    .tagline {
      margin: 0 0 var(--space-5);
      color: var(--color-muted);
      font-size: 1.1rem;
      font-weight: 600;
    }

    .description {
      margin: 0 0 var(--space-6);
      color: var(--color-text);
      line-height: 1.8;
    }

    .details {
      display: grid;
      gap: var(--space-3);
      margin: 0 0 var(--space-6);
      padding: var(--space-5);
      background: #faf5ed;
      border: 1px solid var(--color-border);
      border-radius: 12px;
    }

    .detail {
      display: flex;
      justify-content: space-between;
      gap: var(--space-4);
    }

    .detail strong {
      color: var(--color-primary);
    }

    .detail span {
      color: var(--color-muted);
      text-align: right;
    }

    /* Button */
    .contact-button {
      display: inline-block;
      padding: var(--space-3) var(--space-6);

      background: var(--color-primary);
      color: white;
      border: 0;
      border-radius: var(--radius-button);

      font: inherit;
      font-weight: 700;
      text-decoration: none;
      cursor: pointer;

      transition: background-color 180ms ease;
    }

    /* Hover changes only the lightness of the HSL color */
    .contact-button:hover {
      background: hsl(25 49% 32%);
    }

    .contact-button:focus-visible {
      outline: 3px solid var(--color-accent);
      outline-offset: 3px;
    }

    @media (max-width: 500px) {
      body {
        padding: var(--space-3);
      }

      .profile-card {
        margin: var(--space-3);
        padding: var(--space-6);
      }

      .detail {
        flex-direction: column;
        gap: var(--space-1);
      }

      .detail span {
        text-align: left;
      }
    }
  </style>
</head>

<body>
  <main class="profile-card">
    <p class="category">Bole • Addis Ababa</p>

    <h1>Buna Corner</h1>

    <p class="tagline">
      Good coffee, warm conversations, Addis energy.
    </p>

    <p class="description">
      Buna Corner is a fictional neighborhood café in Bole serving Ethiopian
      coffee.
    </p>

    <div class="details">
      <div class="detail">
        <strong>Location</strong>
        <span>Bole, Addis Ababa</span>
      </div>

      <div class="detail">
        <strong>Hours</strong>
        <span>7:00 AM – 9:00 PM</span>
      </div>

      <div class="detail">
        <strong>Payment</strong>
        <span>Cash &amp; TeleBirr</span>
      </div>
    </div>

    <a class="contact-button" href="mailto:hello@bunacorner.example">
      Contact Us
    </a>
  </main>
</body>
</html>
