<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Ethiopian Airlines Schedule</title>
  <style>
    /* custom properties */
    :root {
  --primary-color: #007a33;
  --accent-color: #fbc02d;
  --spacing: 12px;
  --font-stack: Arial, Helvetica, sans-serif;
}

button {
  background-color: var(--primary-color);
  color: var(--accent-color);
  padding: var(--spacing);
  font-family: var(--font-stack);
  border: 2px solid var(--accent-color);
  border-radius: 6px;
  cursor: pointer;
}
     /* content-box vs border-box */
     .card {
  width: 300px;
  padding: 24px;
  border: 2px solid #333;
  box-sizing: content-box;
}
  .card {
  width: 300px;
  padding: 24px;
  border: 2px solid #333;
  box-sizing: border-box;
}
    table {
  width: 100%;
  border-collapse: collapse;
  font-family: Arial, sans-serif;
}

th,
td {
  padding: 12px 16px;
  text-align: left;
  border-bottom: 1px solid #ddd;
}

th {
  background-color: #007a33;
  color: white;
  font-weight: bold;
}

tr:nth-child(even) {
  background-color: #f2f2f2;
}
     
p {
  color: blue;
}

.text {
  color: green;
}

#intro {
  color: red;
}
  </style>
</head>
<body>
